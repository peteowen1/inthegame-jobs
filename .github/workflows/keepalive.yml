# GitHub disables scheduled workflows in a public repo after 60 days with no
# repository activity, silently: no red run, R2 just goes stale. This repo
# holds only workflow files and rarely gets a commit, so re-enable every
# workflow here once a month. Re-enabling through the API is the method the
# keepalive-workflow action uses instead of dummy commits; the ops health
# check (STALE detection) is the backstop if it ever stops working.
name: Keepalive

on:
  schedule:
    - cron: "7 3 1,15 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable every workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for wf in player-index.yml tennis-tour-draws.yml tennis-draw.yml daily-deck.yml afl-sim-snapshot.yml afl-turnover-points.yml fpl-deadline-snapshot.yml keepalive.yml; do
            gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable"
            echo "enabled $wf: $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf" --jq .state)"
          done
