# FPL deadline snapshots for fplverse (peteowen1/fplverse#17). Unlike the other
# workflows here it checks out nothing: it only saves public FPL API responses.
# Hourly check; when the next FPL deadline is within 2 hours and GW not yet captured,
# save bootstrap-static + fixtures RAW (gzipped) and upload as NEW uniquely-named assets
# to this repo's `fpl-snapshots` release. Never --clobber.
# inthegame-jobs is public, so the release is public (FPL API data is public anyway).
name: fpl-deadline-snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Snapshot now even if the deadline is not within 2 hours'
        type: boolean
        default: false
permissions:
  contents: write   # create release / upload assets
concurrency:
  group: fpl-deadline-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: fpl-snapshots
      UA: 'fplverse-snapshot (github.com/peteowen1/fplverse)'
      FORCE: ${{ github.event.inputs.force }}   # string 'true'/'false' (not inputs.force; see boolean gotcha)
    steps:
      - name: Check deadline and existing captures
        id: chk
        run: |
          set -euo pipefail
          curl -fsS -A "$UA" https://fantasy.premierleague.com/api/bootstrap-static/ -o bs.json
          read -r GW DEADLINE < <(jq -r '[.events[] | select(.is_next)][0] | "\(.id) \(.deadline_time)"' bs.json)
          [ -n "$GW" ] && [ "$GW" != "null" ] || { echo "no next GW"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          secs=$(( $(date -d "$DEADLINE" +%s) - $(date +%s) ))
          echo "GW$GW deadline $DEADLINE in ${secs}s"
          have=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -c "^gw${GW}_" || true)
          go=false
          if [ "$have" -gt 0 ]; then echo "GW$GW already captured"
          elif [ "$secs" -gt 0 ] && [ "$secs" -le 7200 ]; then go=true
          elif [ "$FORCE" = "true" ]; then go=true
          fi
          { echo "go=$go"; echo "gw=$GW"; } >> "$GITHUB_OUTPUT"
      - name: Fetch raw and upload
        if: steps.chk.outputs.go == 'true'
        run: |
          set -euo pipefail
          GW=${{ steps.chk.outputs.gw }}
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          curl -fsS -A "$UA" https://fantasy.premierleague.com/api/bootstrap-static/ -o "gw${GW}_${STAMP}_bootstrap-static.json"
          curl -fsS -A "$UA" https://fantasy.premierleague.com/api/fixtures/ -o "gw${GW}_${STAMP}_fixtures.json"
          jq -e '.elements | length > 300' "gw${GW}_${STAMP}_bootstrap-static.json" >/dev/null   # sanity: real payload
          gzip -9 gw${GW}_${STAMP}_*.json
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "FPL deadline snapshots" \
              --notes "Raw FPL snapshots before each deadline. New assets only, never overwritten."
          gh release upload "$TAG" gw${GW}_${STAMP}_*.json.gz -R "$GITHUB_REPOSITORY"   # no --clobber
