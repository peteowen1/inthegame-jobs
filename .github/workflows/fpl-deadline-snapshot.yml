# FPL deadline snapshots for fplverse (peteowen1/fplverse#17). Unlike the other
# workflows here it checks out nothing: it only saves public FPL API responses.
# Every 30 minutes; on every run within 2 hours of the next FPL deadline, save
# bootstrap-static + fixtures RAW (gzipped) as NEW uniquely-named assets on this
# repo's `fpl-snapshots` release, so each gameweek gets up to 4 snapshots and the
# last is at most ~30 minutes before the deadline (more if GitHub delays the run).
# No "already captured" check, so a failed or partial run is simply followed by
# the next one. Never --clobber. inthegame-jobs is public, so the release is
# public (FPL API data is public anyway).
name: fpl-deadline-snapshot
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Snapshot now even if the deadline is not within 2 hours'
        type: boolean
        default: false
permissions:
  contents: write   # create release / upload assets
concurrency:
  group: fpl-deadline-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: fpl-snapshots
      UA: 'fplverse-snapshot (github.com/peteowen1/fplverse)'
      FORCE: ${{ github.event.inputs.force }}   # string 'true'/'false'; empty on schedule runs
    steps:
      - name: Check deadline
        id: chk
        run: |
          set -euo pipefail
          curl -fsS -A "$UA" https://fantasy.premierleague.com/api/bootstrap-static/ -o bs.json
          read -r GW DEADLINE < <(jq -r '[.events[] | select(.is_next)][0] | "\(.id) \(.deadline_time)"' bs.json)
          [[ "$GW" =~ ^[0-9]+$ ]] || { echo "no next GW"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          secs=$(( $(date -d "$DEADLINE" +%s) - $(date +%s) ))
          echo "GW$GW deadline $DEADLINE in ${secs}s"
          go=false
          if [ "$secs" -gt 0 ] && [ "$secs" -le 7200 ]; then go=true
          elif [ "$FORCE" = "true" ]; then go=true
          fi
          { echo "go=$go"; echo "gw=$GW"; } >> "$GITHUB_OUTPUT"
      - name: Fetch raw and upload
        if: steps.chk.outputs.go == 'true'
        env:
          GW: ${{ steps.chk.outputs.gw }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          curl -fsS -A "$UA" https://fantasy.premierleague.com/api/bootstrap-static/ -o "gw${GW}_${STAMP}_bootstrap-static.json"
          curl -fsS -A "$UA" https://fantasy.premierleague.com/api/fixtures/ -o "gw${GW}_${STAMP}_fixtures.json"
          jq -e '.elements | length > 300' "gw${GW}_${STAMP}_bootstrap-static.json" >/dev/null   # sanity: real payload
          jq -e 'type == "array" and length > 0' "gw${GW}_${STAMP}_fixtures.json" >/dev/null
          gzip -9 gw${GW}_${STAMP}_*.json
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --latest=false --title "FPL deadline snapshots" \
              --notes "Raw FPL snapshots taken in the 2 hours before each deadline (every 30 minutes). New assets only, never overwritten."
          gh release upload "$TAG" gw${GW}_${STAMP}_*.json.gz -R "$GITHUB_REPOSITORY"   # no --clobber
          echo "uploaded GW$GW snapshot $STAMP"
