# MOVED 2026-10-26 from inthegame-blog/.github/workflows/ to this public repo
# (peteowen1/inthegame-jobs), which gets free Actions minutes. The steps are
# unchanged; only the checkout now pulls the private repo in. See README.md.
#
# Publish afl/sim-snapshot.json to R2: the AFL season simulation /afl/ladder
# shows (premiership, top-4 and finals odds per club), built by running the
# pages' own afl/season-live-sim.js in node (scripts/build-afl-sim-snapshot.mjs).
# functions/afl/{ladder,simulator}.js write it into those pages' HTML for
# crawlers that run no JavaScript, and ignore a copy older than 24 hours.
# Also afl/league-sim.json (inthegame-blog#1036): the same 100,000-season run
# in full, with the signatures of its model and results; /afl/ladder and
# /afl/team show it instead of simulating in the browser when theirs match.
name: AFL sim snapshot

on:
  schedule:
    # Hourly (was every 6 hours until 2026-10-30, #1036): afl/league-sim.json
    # is what readers see once a result is in, so a finished game reaches it
    # within the hour. ~25 s a run once the season is decided, ~3 min at its
    # start (17 s per 10,000 seasons with nothing locked); free here.
    - cron: "41 * * * *"
  workflow_dispatch:

concurrency:
  group: afl-sim-snapshot
  cancel-in-progress: false

# GITHUB_TOKEN is unused: the checkout uses ITG_READ_TOKEN, uploads use the Cloudflare token.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The scripts live in the private site repo; this public repo holds only
      # the workflow. Latest commit of main, no history, token not kept in .git.
      - name: Checkout inthegame-blog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: peteowen1/inthegame-blog
          ref: main
          token: ${{ secrets.ITG_READ_TOKEN }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install hyparquet
        run: npm ci --no-audit --no-fund

      # Includes one real run of the pages' sim code against R2.
      - name: Test the builder
        run: node scripts/afl-sim-snapshot.test.mjs

      - name: Build
        run: node scripts/build-afl-sim-snapshot.mjs sim-snapshot.json league-sim.json league-sim-history.json

      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --remote is REQUIRED in wrangler v4, or the write goes to a local
          # simulation and the job passes having published nothing.
          npx --yes wrangler@4 r2 object put "inthegame-data/afl/sim-snapshot.json" --file sim-snapshot.json \
            --content-type application/json --cache-control "public, max-age=600" --remote
          # The season's flag-odds history (inthegame-blog#805), only when this
          # run saved a round (the builder writes no file otherwise; an older
          # builder ignores the third argument). Before league-sim.json, whose
          # `history` field points at it.
          if [ -f league-sim-history.json ]; then
            season=$(node -e "console.log(require('./league-sim-history.json').season)")
            npx --yes wrangler@4 r2 object put "inthegame-data/afl/league-sim-history-$season.json" --file league-sim-history.json \
              --content-type application/json --cache-control "public, max-age=300" --remote
          fi
          # Shorter cache: a page only adopts it when its results match, so a
          # stale edge copy just means the browser simulates for a while.
          npx --yes wrangler@4 r2 object put "inthegame-data/afl/league-sim.json" --file league-sim.json \
            --content-type application/json --cache-control "public, max-age=300" --remote

      - name: Confirm what is actually served
        run: |
          want=$(node -e "console.log(require('./sim-snapshot.json').built_at)")
          got=$(curl -fsS "https://pub-ee4bf5b599a047f9ac2b9facc1587008.r2.dev/afl/sim-snapshot.json?cb=$GITHUB_RUN_ID" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).built_at))")
          echo "built $want, served $got"
          [ "$want" = "$got" ] || { echo "::error::R2 serves an older afl/sim-snapshot.json"; exit 1; }
          got=$(curl -fsS "https://pub-ee4bf5b599a047f9ac2b9facc1587008.r2.dev/afl/league-sim.json?cb=$GITHUB_RUN_ID" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).built_at))")
          echo "league-sim: built $want, served $got"
          [ "$want" = "$got" ] || { echo "::error::R2 serves an older afl/league-sim.json"; exit 1; }
